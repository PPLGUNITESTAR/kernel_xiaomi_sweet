name: "Build Kernel"

# ------------------------------------------------------------------
# INPUT: KSU selector dipilih saat trigger workflow
# ------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      ksu_selector:
        description: "KernelSU Variant"
        required: true
        default: "NONE"
        type: choice
        options:
          - NONE
          - KSU_BLXX
          - KSU_NEXT

env:
  # --- NERV HQ CONFIGURATION ---
  KERNEL_NAME: "FranxxCORE"
  DEVICE: "Sweet"
  CODENAME: "AHumanWorks"
  DEFCONFIG: "sweet_defconfig"
  CLANG_VER: "r547379"
  CLANG_URL: "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"

  # --- MAGI SYSTEM IDENTITY ---
  KBUILD_BUILD_USER: "RapliVX"
  KBUILD_BUILD_HOST: "NyarchLinux"
  TZ: "Asia/Jakarta"

  # --- SECURITY CLEARANCE ---
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

  # --- KSU SOURCES (ported from build.sh) ---
  KSU_BLXX_SETUP_URI: "https://github.com/backslashxx/KernelSU/raw/refs/heads/master/kernel/setup.sh"
  KSU_BLXX_BRANCH: "master"
  KSU_NEXT_SETUP_URI: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
  KSU_NEXT_BRANCH: "legacy_susfs"
  KSU_NEXT_HOOK_PATCH: "https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd/raw/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh"
  KSU_UMOUNT_PATCH: "https://github.com/tbyool/android_kernel_xiaomi_sm6150/commit/64db0dfa2f8aa6c519dbf21eb65c9b89643cda3d.patch"
  KSU_KPATCH_FIX: "https://github.com/TheSillyOk/kernel_ls_patches/raw/refs/heads/master/kpatch_fix.patch"

  # --- SUSFS (simonpunk/susfs4ksu, kernel-4.14) ---
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "kernel-4.14"

jobs:
  # ------------------------------------------------------------------
  # PHASE 0: PREPARATION (ENVIRONMENT SETUP)
  # ------------------------------------------------------------------
  setup_env:
    name: "🛠️ PREPARE // ENVIRONMENT"
    runs-on: ubuntu-22.04
    steps:
      - name: "⚡ [CACHE] :: CLANG_TOOLCHAIN"
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: ${{ runner.os }}-clang-${{ env.CLANG_VER }}

      - name: "🔧 [DOWNLOAD] :: CLANG_TOOLCHAIN"
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang..."
          wget -q ${{ env.CLANG_URL }} -O aosp-clang.tar.gz
          mkdir -p aosp-clang
          tar -xf aosp-clang.tar.gz -C aosp-clang
          rm -f aosp-clang.tar.gz

  # ------------------------------------------------------------------
  # PHASE 1: PARALLEL SYNCHRONIZATION (MATRIX BUILD)
  # Matrix: AOSP vs MIUI — KSU ditentukan dari workflow_dispatch input
  # ------------------------------------------------------------------
  synchronization:
    name: "🛡️ ${{ matrix.unit }} // BUILD"
    needs: setup_env
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: "UNIT-00 (AOSP)"
            variant: "AOSP"
            patch_miui: false
          - unit: "UNIT-01 (MIUI)"
            variant: "MIUI"
            patch_miui: true

    steps:
      - name: "⬢ [INIT] :: SOURCE_CHECKOUT"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "⚡ [RESTORE] :: CLANG_TOOLCHAIN"
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: ${{ runner.os }}-clang-${{ env.CLANG_VER }}
          fail-on-cache-miss: true

      - name: "⚡ [CACHE] :: CCACHE_ACCELERATION"
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.variant }}-${{ inputs.ksu_selector }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.variant }}-${{ inputs.ksu_selector }}-
            ${{ runner.os }}-ccache-${{ matrix.variant }}-
            ${{ runner.os }}-ccache-

      - name: "⬢ [SYSTEM] :: DEPENDENCIES"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git libncurses5-dev libssl-dev libxml2 libxml2-utils lzop make \
          python3 python3-pip unzip zip zlib1g-dev

      - name: "⚙️ [CONFIG] :: CCACHE_SETUP"
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 2G
          ccache -o compression=true
          ccache -o compression_level=1
          ccache -z

      # ----------------------------------------------------------------
      # KSU: NONE — purge semua CONFIG_KSU dari defconfig
      # ----------------------------------------------------------------
      - name: "🧹 [MOD] :: KSU_PURGE"
        if: inputs.ksu_selector == 'NONE'
        run: |
          echo "KSU selector: NONE — purging KSU configs..."
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/${{ env.DEFCONFIG }}

      # ----------------------------------------------------------------
      # KSU: KSU_BLXX (backslashxx/KernelSU, hookless mode)
      # ----------------------------------------------------------------
      - name: "🧬 [MOD] :: KSU_BLXX_INTEGRATION"
        if: inputs.ksu_selector == 'KSU_BLXX'
        run: |
          echo "⚠️ INITIATING KSU_BLXX PROTOCOL ..."

          # apply_patch: download ke file dulu lalu patch --batch --forward
          # --batch  = jangan prompt interaktif sama sekali
          # --forward = skip kalau patch sudah applied (reversed detected), bukan error
          apply_patch() {
            local URL="$1"
            local PATCHFILE=$(mktemp /tmp/kpatch.XXXXXX.patch)
            wget -q "$URL" -O "$PATCHFILE"
            patch -p1 --fuzz=3 --batch --forward < "$PATCHFILE" || true
            rm -f "$PATCHFILE"
          }
          apply_patch "${{ env.KSU_UMOUNT_PATCH }}"
          apply_patch "${{ env.KSU_KPATCH_FIX }}"

          # Setup KernelSU (hookless mode)
          curl -LSs "${{ env.KSU_BLXX_SETUP_URI }}" | bash -s ${{ env.KSU_BLXX_BRANCH }}

          # Manual config enablement
          cat >> arch/arm64/configs/${{ env.DEFCONFIG }} << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_TAMPER_SYSCALL_TABLE=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KRETPROBES=y
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y
          EOF

      # ----------------------------------------------------------------
      # KSU: KSU_NEXT (KernelSU-Next, manual hook mode)
      # ----------------------------------------------------------------
      - name: "🧬 [MOD] :: KSU_NEXT_INTEGRATION"
        if: inputs.ksu_selector == 'KSU_NEXT'
        run: |
          echo "⚠️ INITIATING KSU_NEXT PROTOCOL ..."

          # apply_patch: download ke file dulu lalu patch --batch --forward
          # --batch  = jangan prompt interaktif sama sekali
          # --forward = skip kalau patch sudah applied (reversed detected), bukan error
          apply_patch() {
            local URL="$1"
            local PATCHFILE=$(mktemp /tmp/kpatch.XXXXXX.patch)
            wget -q "$URL" -O "$PATCHFILE"
            patch -p1 --fuzz=3 --batch --forward < "$PATCHFILE" || true
            rm -f "$PATCHFILE"
          }
          apply_patch "${{ env.KSU_UMOUNT_PATCH }}"
          apply_patch "${{ env.KSU_KPATCH_FIX }}"

          # Apply inline hook patch
          curl -LSs "${{ env.KSU_NEXT_HOOK_PATCH }}" | bash

          # Setup KernelSU-Next
          curl -LSs "${{ env.KSU_NEXT_SETUP_URI }}" | bash -s ${{ env.KSU_NEXT_BRANCH }}

          # Manual config enablement
          cat >> arch/arm64/configs/${{ env.DEFCONFIG }} << 'EOF'
          CONFIG_KSU=y
          KSU_MANUAL_HOOK=y
          EOF

      # ----------------------------------------------------------------
      # SUSFS — apply untuk KSU_BLXX dan KSU_NEXT
      # Sumber: simonpunk/susfs4ksu kernel-4.14
      # ----------------------------------------------------------------
      - name: "🩹 [PATCH] :: SUSFS_INTEGRATION"
        if: inputs.ksu_selector != 'NONE'
        run: |
          echo "⚠️ APPLYING SUSFS (simonpunk/susfs4ksu, kernel-4.14) ..."
          git clone -q --depth=1 -b "${{ env.SUSFS_BRANCH }}" "${{ env.SUSFS_REPO }}" susfs4ksu

          # Step 1: Copy SUSFS source files langsung — zero patch conflict
          echo "Copying SUSFS source files..."
          cp -v susfs4ksu/kernel_patches/fs/susfs.c                   fs/
          cp -v susfs4ksu/kernel_patches/include/linux/susfs.h        include/linux/
          cp -v susfs4ksu/kernel_patches/include/linux/susfs_def.h    include/linux/

          # Step 2: KSU-side enablement patch (ke folder KernelSU jika ada)
          KSU_ENABLE_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_ENABLE_PATCH" ] && [ -d "KernelSU" ]; then
            echo "Applying KSU-side SUSFS enablement patch..."
            patch -p1 -d KernelSU < "$KSU_ENABLE_PATCH" --fuzz=3 || {
              echo "⚠️ KSU-side patch had issues, continuing..."
            }
          fi

          # Step 3: Apply kernel-side SUSFS patch
          # --batch --forward: skip hunks yang sudah applied (cred.h/cred.c sudah ada di tree ini)
          SUSFS_KPATCH="susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch"
          echo "Applying kernel-side SUSFS patch..."
          patch -p1 --fuzz=3 --batch --forward < "$SUSFS_KPATCH" || true

          # Step 4: Manual fix untuk reject yang diketahui di kernel sweet/sm6150
          echo "Applying manual fixes for known rejects..."
          python3 << 'PYEOF'
          import re, sys

          # ── Fix A: kernel/sys.c ──────────────────────────────────────────────
          # Patch SUSFS mau inject susfs_spoof_uname() di SYSCALL_DEFINE1(newuname)
          # tapi hunk gagal karena offset berbeda. Kita inject manual via regex.
          print("Fixing kernel/sys.c ...")
          with open("kernel/sys.c", "r") as f:
              sys_c = f.read()

          # Cek apakah sudah ada (idempotent)
          if "susfs_spoof_uname" not in sys_c:
              # Inject extern declaration + call sebelum up_read(&uts_sem)
              old_block = (
                  "down_read(&uts_sem);
"
                  "	memcpy(&tmp, utsname(), sizeof(tmp));
"
                  "	up_read(&uts_sem);"
              )
              new_block = (
                  "down_read(&uts_sem);
"
                  "	memcpy(&tmp, utsname(), sizeof(tmp));
"
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
"
                  "	susfs_spoof_uname(&tmp);
"
                  "#endif
"
                  "	up_read(&uts_sem);"
              )
              # Tambah extern declaration sebelum SYSCALL_DEFINE1(newuname)
              extern_decl = (
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
"
                  "extern void susfs_spoof_uname(struct new_utsname* tmp);
"
                  "#endif
"
                  "SYSCALL_DEFINE1(newuname,"
              )
              if old_block in sys_c:
                  sys_c = sys_c.replace("SYSCALL_DEFINE1(newuname,", extern_decl, 1)
                  sys_c = sys_c.replace(old_block, new_block, 1)
                  with open("kernel/sys.c", "w") as f:
                      f.write(sys_c)
                  print("  ✅ kernel/sys.c patched")
              else:
                  print("  ⚠️  kernel/sys.c: anchor not found, skipping (may already be patched differently)")
          else:
              print("  ✅ kernel/sys.c: already patched, skipping")

          # ── Fix B: fs/open.c ─────────────────────────────────────────────────
          # susfs_is_current_proc_umounted() dipanggil tapi deklarasinya tidak masuk
          # karena hunk di fs/open.c juga mungkin offset. Pastikan include susfs.h ada.
          print("Fixing fs/open.c ...")
          with open("fs/open.c", "r") as f:
              open_c = f.read()

          if "susfs.h" not in open_c and "susfs_is_current_proc_umounted" in open_c:
              # Tambah include di baris pertama setelah linux/fs.h
              open_c = open_c.replace(
                  "#include <linux/fs.h>",
                  "#include <linux/fs.h>
#include <linux/susfs.h>",
                  1
              )
              with open("fs/open.c", "w") as f:
                  f.write(open_c)
              print("  ✅ fs/open.c: added susfs.h include")
          elif "susfs_is_current_proc_umounted" not in open_c:
              print("  ⚠️  fs/open.c: susfs call not found — SUSFS patch may not have applied to this file")
              sys.exit(1)
          else:
              print("  ✅ fs/open.c: already OK")
          PYEOF

          # Step 5: Append SUSFS configs ke defconfig
          echo "Appending SUSFS configs to defconfig..."
          cat >> arch/arm64/configs/${{ env.DEFCONFIG }} << 'EOF'
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=n
CONFIG_KSU_SUSFS_SUS_MOUNT=n
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=n
EOF

          echo "✅ SUSFS integration complete."

      - name: "📤 [DEBUG] :: UPLOAD_SUSFS_REJECTS"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-rejects-${{ matrix.variant }}
          path: /tmp/susfs_rejects/
          if-no-files-found: ignore
          retention-days: 3

      # ----------------------------------------------------------------
      # MIUI DT dimension patch
      # ----------------------------------------------------------------
      - name: "🩹 [PATCH] :: MIUI_OPTIMIZATION"
        if: matrix.patch_miui == true
        run: |
          python3 -c "
          import os, re
          targets = ['dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi', 'dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi']
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file in targets:
                      path = os.path.join(root, file)
                      with open(path, 'r') as f: content = f.read()
                      content = re.sub(r'qcom,mdss-pan-physical-width-dimension\s*=\s*<[0-9]+>;',  'qcom,mdss-pan-physical-width-dimension = <695>;',  content)
                      content = re.sub(r'qcom,mdss-pan-physical-height-dimension\s*=\s*<[0-9]+>;', 'qcom,mdss-pan-physical-height-dimension = <1546>;', content)
                      with open(path, 'w') as f: f.write(content)
                      print(f'Patched MIUI dimensions: {path}')
          "

      # ----------------------------------------------------------------
      # COMPILE
      # ----------------------------------------------------------------
      - name: "⚔️ [COMPILE] :: KERNEL_BUILD"
        run: |
          export PATH="${{ github.workspace }}/aosp-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ${{ env.DEFCONFIG }}

          make -j$(nproc --all) O=out \
            LLVM=1 LLVM_IAS=1 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbo.img dtb.img

      - name: "📊 [STATS] :: CCACHE_REPORT"
        run: ccache -s

      - name: "📤 [UPLOAD] :: ARTIFACTS"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ inputs.ksu_selector }}-unit
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img
          compression-level: 9

  # ------------------------------------------------------------------
  # PHASE 2: DEPLOYMENT (ZIPPING & RELEASING)
  # ------------------------------------------------------------------
  human-instrumentality:
    name: "🧬 PROTOCOL: FINAL_DOGMA"
    runs-on: ubuntu-latest
    needs: [synchronization]
    permissions:
      contents: write

    steps:
      - name: "📥 [COLLECT] :: ARTIFACTS"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: "📦 [PACKAGE] :: ANYKERNEL3_ZIP"
        run: |
          mkdir -p release_zips
          git clone -q https://github.com/RapliVx/AnyKernel3.git -b sweet AnyKernel3

          cat > AnyKernel3/banner << 'EOF'
           SORY                                  
           QXQVYXY                               
           SNRXWYXZ                         RNKJOY          
            YXYYYYYYXY                  PLOSUYXYOXNJCV          
              YXY YXYXSRV            VTV LZUKGLDDWPARAS          
                YXYYYVUUUYY        QEAAAIXPNOJCEDLTAQAR          
                  YYYVUVT YXY     WLFPSNGPNKTLJNAUIXCHV          
                    YWQYUPTSJISPLSQAAEPHGFWGLEAJPMLM              
                      TQR RPKJHFPIVQQLYMCFTBIAJYPPNP              
                        RNTSFMGHPMAAAAKUFJURFL VRXNT              
                          WUONRTOAFGQRMLTKMOOPWWTPUVQRW          
                            XWXWOAAANOLTTMJVTMWZXXYSVTU VTV      
                              PMXPVWRSUSXSSSYOTVSUYURSXYTYSY      
                              LVNTOWJCPNUMUSWMSILQYXXYZXVSXWX    
                              QLPQGJMYNJXPSSMWSVPOKRZXYY YWXTW   
                                  WUW QHSLTUVQPJNRSO YZZVTYTXU   
                                      UIKJUOMTOSULKR ZYYUXTYVW   
                                      VTMTPGSJ         XVUYVYZ   
                                      VYTRULUM         ZYWVWXZ   
                                      WUVXSROP           YWWY    
                                       YTQZLNR                   
                                       PURTWU                   
                                       SOXXTU                   
                                        TQOSU                   
                                        YXXWX                   
          
           FranxxCORE // MAMBOSU PROTOCOL
           BY RapliVX
          EOF

          for DIR in ./artifacts/*-unit; do
            VARIANT=$(basename "$DIR" -unit)
            echo "Packaging $VARIANT..."
            cp -f "$DIR/Image.gz"  AnyKernel3/
            cp -f "$DIR/dtb.img"   AnyKernel3/
            cp -f "$DIR/dtbo.img"  AnyKernel3/
            cd AnyKernel3
            zip -r1 "../release_zips/${KERNEL_NAME}-${VARIANT}-${CODENAME}-$(date +'%Y%m%d').zip" . -x ".git/*" -x "README.md"
            cd ..
          done

      - name: "⬆️ [RELEASE] :: GITHUB_RELEASE"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "EVA-${{ github.run_number }}"
          name: "ProjectEVA: MAMBOSU [Run ${{ github.run_number }}] [${{ inputs.ksu_selector }}]"
          files: release_zips/*.zip
          body: |
            ### ⚠️ NERV SECURITY CLEARANCE REQUIRED
            **Mission:** Kernel Instrumentality
            **Device:** Redmi Note 10 Pro (sweet)
            **Compiler:** Clang ${{ env.CLANG_VER }}
            **KSU Variant:** `${{ inputs.ksu_selector }}`

            #### 📦 DEPLOYED UNITS:
            | Variant | KSU | SUSFS | MIUI Patch |
            | :--- | :---: | :---: | :---: |
            | **AOSP** | `${{ inputs.ksu_selector }}` | ${{ inputs.ksu_selector != 'NONE' && '✅' || '❌' }} | ❌ |
            | **MIUI** | `${{ inputs.ksu_selector }}` | ${{ inputs.ksu_selector != 'NONE' && '✅' || '❌' }} | ✅ |

            *Synchronization Ratio: 200%*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "📡 [NOTIFY] :: TELEGRAM_BOT"
        if: success()
        run: |
          MSG="<b>🚨 MAGI SYSTEM // MISSION COMPLETE 🚨</b>%0A%0A"
          MSG+="<b>TARGET:</b> ProjectEVA MAMBOSU%0A"
          MSG+="<b>KSU:</b> ${{ inputs.ksu_selector }}%0A"
          MSG+="<b>UNITS:</b> 2 Variants Deployed (AOSP + MIUI)%0A"
          MSG+="🔗 <a href='https://github.com/${{ github.repository }}/releases/tag/EVA-${{ github.run_number }}'>ACCESS DATA TERMINAL</a>"

          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT_ID" \
            -d text="$MSG" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true
